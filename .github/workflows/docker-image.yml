name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# Actions are pinned to commit SHAs; Renovate keeps them up to date.

# Every supported PHP version is built from main. Images are published only from main;
# pull requests (and manual runs on other branches) build and test every image without pushing.
on:
  schedule:
    # weekly rebuild for base image and package security fixes, off the hour when GitHub is less busy
    - cron: "17 23 * * 3"
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions: {}

# a newer pull request run replaces an older one; a main run is never cancelled halfway through tagging
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKERHUB_IMAGE: msonowal/docker-php-node
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  PUBLISH: ${{ github.ref == 'refs/heads/main' }}
  # gets latest, edge, main, nightly and sha-<commit>, and the -cloud variant
  LATEST_PHP: "8.5"
  # {0} is the PHP version
  IMAGE_DESCRIPTION: PHP {0}, Node.js 24 LTS and Composer 2 on Alpine, with PHP QA tools, for CI and local dev
  CLOUD_IMAGE_DESCRIPTION: docker-php-node plus Docker, kubectl, Helm, OpenTofu, Terraform, gcloud and Firebase CLIs
  TEST_IMAGE: docker-php-node:test
  # renovate: datasource=docker depName=aquasec/trivy
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0

      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

      - name: Audit workflows
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          advanced-security: false

      - name: Lint scripts
        run: shellcheck bin/* tests/*.sh

  # Build, test and scan each image natively on its own runner (no QEMU), then push it by digest
  build:
    name: build (${{ matrix.php }}, ${{ matrix.variant }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        variant: [base, cloud]
        arch: [amd64, arm64]
        # -cloud is built for the newest PHP only
        exclude:
          - php: "8.2"
            variant: cloud
          - php: "8.3"
            variant: cloud
          - php: "8.4"
            variant: cloud
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      # pushes the per-platform images
      packages: write
      # uploads the scan results to code scanning
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3
          persist-credentials: false

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          labels: |
            org.opencontainers.image.description=${{ matrix.variant == 'cloud' && env.CLOUD_IMAGE_DESCRIPTION || format(env.IMAGE_DESCRIPTION, matrix.php) }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to DockerHub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # loads the image into Docker for the tests; the push below reuses this build's cache
      - name: Build for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.variant }}
          platforms: linux/${{ matrix.arch }}
          build-args: PHP_VERSION=${{ matrix.php }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.TEST_IMAGE }}
          load: true
          sbom: false
          provenance: false

      - name: Smoke test
        env:
          PHP_VERSION: ${{ matrix.php }}
          VARIANT: ${{ matrix.variant }}
        run: docker run --rm -v "$PWD/tests:/tests:ro" "$TEST_IMAGE" sh /tests/smoke.sh "$PHP_VERSION" "$VARIANT"

      # the SBOM and provenance attestations are carried into the multi-arch index by the merge job
      - name: Build and push by digest
        id: build
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.variant }}
          platforms: linux/${{ matrix.arch }}
          build-args: PHP_VERSION=${{ matrix.php }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          outputs: type=image,"name=${{ env.DOCKERHUB_IMAGE }},${{ env.GHCR_IMAGE }}",push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.php }}-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      # Report known vulnerabilities to code scanning, without failing the build
      - name: Scan image with Trivy
        if: env.PUBLISH == 'true'
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" -w /work "$TRIVY_IMAGE" image \
            --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --timeout 15m \
            --format sarif --output trivy.sarif "$TEST_IMAGE"

      # the newest PHP keeps the original category names, so existing analyses stay linked
      - name: Upload results to code scanning
        if: env.PUBLISH == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: ${{ matrix.variant == 'cloud' && format('trivy-cloud-{0}', matrix.arch) || matrix.php == env.LATEST_PHP && format('trivy-{0}', matrix.arch) || format('trivy-php{0}-{1}', matrix.php, matrix.arch) }}

  # Combine each image's per-platform digests into multi-arch tags on both registries, and sign them.
  # Runs even when another version's build failed, so one broken version doesn't hold back the rest.
  merge:
    name: merge (${{ matrix.php }}, ${{ matrix.variant }})
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        variant: [base, cloud]
        exclude:
          - php: "8.2"
            variant: cloud
          - php: "8.3"
            variant: cloud
          - php: "8.4"
            variant: cloud
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # pushes the multi-arch tags and their signatures
      packages: write
      # OIDC token for keyless signing
      id-token: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.php }}-${{ matrix.variant }}-*
          merge-multiple: true

      - name: Set the version tag
        id: version
        env:
          PHP_VERSION: ${{ matrix.php }}
        run: echo "tag=php${PHP_VERSION//./}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          # https://github.com/docker/metadata-action
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
            type=raw,value=latest,enable=${{ matrix.php == env.LATEST_PHP }}
            type=raw,value=edge,enable=${{ matrix.php == env.LATEST_PHP }}
            type=raw,value=main,enable=${{ matrix.php == env.LATEST_PHP }}
            type=schedule,enable=${{ matrix.php == env.LATEST_PHP }}
            type=sha,enable=${{ matrix.php == env.LATEST_PHP }}
          flavor: |
            suffix=${{ matrix.variant == 'cloud' && '-cloud' || '' }},onlatest=true
          annotations: |
            org.opencontainers.image.description=${{ matrix.variant == 'cloud' && env.CLOUD_IMAGE_DESCRIPTION || format(env.IMAGE_DESCRIPTION, matrix.php) }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to DockerHub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      # each registry's tags point at the digests pushed to that same registry;
      # verify the signatures with `cosign verify` (see README)
      - name: Create, push and sign manifest lists
        working-directory: ${{ runner.temp }}/digests
        shell: bash
        run: |
          # never publish a single-platform tag when one platform's build failed
          count=$(find . -type f | wc -l)
          if [ "$count" -ne 2 ]; then
            echo "::error::expected 2 platform digests, found $count"
            exit 1
          fi
          for image in "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
            tags=()
            for tag in $(jq -r --arg image "$image" '.tags[] | select(startswith($image + ":"))' <<< "$DOCKER_METADATA_OUTPUT_JSON"); do
              tags+=("$tag")
            done
            args=()
            for tag in "${tags[@]}"; do
              args+=(-t "$tag")
            done
            while IFS= read -r annotation; do
              args+=(--annotation "$annotation")
            done < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
            for digest in *; do
              args+=("$image@sha256:$digest")
            done
            docker buildx imagetools create "${args[@]}"
            docker buildx imagetools inspect "${tags[0]}"
            digest=$(docker buildx imagetools inspect "${tags[0]}" --format '{{json .Manifest}}' | jq -re .digest)
            cosign sign --yes "$image@$digest"
          done

  # Keep the Docker Hub page in sync with README.md
  dockerhub-readme:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: ${{ format(env.IMAGE_DESCRIPTION, '8.2–8.5') }}
          enable-url-completion: true

  # GitHub disables scheduled workflows after 60 days without repository activity.
  # Re-enabling the workflow from its own scheduled run is reported to reset that timer.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      # enables this workflow
      actions: write

    steps:
      - name: Keep the weekly rebuild enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/docker-image.yml/enable"
