name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# Actions are pinned to commit SHAs; Renovate keeps them up to date.

on:
  schedule:
    - cron: "0 23 * * 3"
  push:
    branches:
      - "**"
      # Renovate's changes are built by their pull requests, without publishing
      - "!renovate/**"
    tags:
      - "v*.*.*"
      - "php*.*.*"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions: {}

env:
  DOCKERHUB_IMAGE: msonowal/docker-php-node
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  IMAGE_DESCRIPTION: PHP 8.5, Node.js 24 LTS and Composer 2 on Alpine, with PHP QA tools, for CI and local dev
  # renovate: datasource=docker depName=aquasec/trivy
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
  # Docker tags to generate, shared by the build and merge jobs
  # https://github.com/docker/metadata-action
  TAG_RULES: |
    type=schedule
    type=ref,event=branch
    type=ref,event=pr
    type=semver,pattern={{version}}
    type=semver,pattern={{major}}.{{minor}}
    type=semver,pattern={{major}}
    type=sha
    type=edge,branch=main
    type=raw,value=latest,enable={{is_default_branch}}
    type=raw,value=php85,enable={{is_default_branch}}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0

      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

      - name: Audit workflows
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.31.1
          advanced-security: false

      - name: Lint scripts
        run: shellcheck bin/*

  # Build each platform natively on its own runner (no QEMU) and push it by digest
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      # pushes the per-platform images
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3
          persist-credentials: false

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: ${{ env.TAG_RULES }}
          labels: |
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # the SBOM and provenance attestations are carried into the multi-arch index by the merge job
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          outputs: type=image,"name=${{ env.DOCKERHUB_IMAGE }},${{ env.GHCR_IMAGE }}",push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the per-platform digests into multi-arch tags on both registries
  merge:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      dockerhub-digest: ${{ steps.digests.outputs.dockerhub }}
      ghcr-digest: ${{ steps.digests.outputs.ghcr }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: ${{ env.TAG_RULES }}
          annotations: |
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # each registry's tags point at the digests pushed to that same registry
      - name: Create manifest lists and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          for image in "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
            args=()
            for tag in $(jq -r --arg image "$image" '.tags[] | select(startswith($image + ":"))' <<< "$DOCKER_METADATA_OUTPUT_JSON"); do
              args+=(-t "$tag")
            done
            while IFS= read -r annotation; do
              args+=(--annotation "$annotation")
            done < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
            for digest in *; do
              args+=("$image@sha256:$digest")
            done
            docker buildx imagetools create "${args[@]}"
          done

      - name: Inspect image
        id: digests
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "$DOCKERHUB_IMAGE:$VERSION"
          docker buildx imagetools inspect "$GHCR_IMAGE:$VERSION"
          echo "dockerhub=$(docker buildx imagetools inspect "$DOCKERHUB_IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
          echo "ghcr=$(docker buildx imagetools inspect "$GHCR_IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"

  # Sign each registry's multi-arch index with keyless cosign; verify with `cosign verify` (see README)
  sign:
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      # pushes the signatures next to the images
      packages: write
      # OIDC token for keyless signing
      id-token: write

    steps:
      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Sign images
        env:
          DOCKERHUB_DIGEST: ${{ needs.merge.outputs.dockerhub-digest }}
          GHCR_DIGEST: ${{ needs.merge.outputs.ghcr-digest }}
        run: |
          cosign sign --yes "$GHCR_IMAGE@$GHCR_DIGEST"
          cosign sign --yes "$DOCKERHUB_IMAGE@$DOCKERHUB_DIGEST"

  # Report known vulnerabilities to code scanning, without failing the build
  scan:
    needs: merge
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # uploads the scan results to code scanning
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan image with Trivy
        env:
          IMAGE: ${{ env.GHCR_IMAGE }}@${{ needs.merge.outputs.ghcr-digest }}
          PLATFORM: linux/${{ matrix.arch }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work "$TRIVY_IMAGE" image \
            --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL \
            --platform "$PLATFORM" --format sarif --output trivy.sarif "$IMAGE"

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.arch }}

  # Keep the Docker Hub page in sync with README.md
  dockerhub-readme:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: ${{ env.IMAGE_DESCRIPTION }}
          enable-url-completion: true
